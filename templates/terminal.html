<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Terminal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas,monospace;
}

body{

    background:#0c0c0c;
    color:#ffffff;
    height:100vh;
    display:flex;
    flex-direction:column;

}

.header{

    height:55px;
    background:#1f1f1f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #333;

}

.header h2{

    font-size:18px;
    color:#00ff99;

}

button{

    background:#222;
    color:white;
    border:1px solid #555;
    padding:8px 18px;
    cursor:pointer;
    border-radius:4px;

}

button:hover{

    background:#333;

}

#terminal{

    flex:1;
    overflow-y:auto;
    padding:20px;
    white-space:pre-wrap;
    color:#00ff66;

}

.input-area{

    display:flex;
    align-items:center;
    padding:12px;
    background:#111;
    border-top:1px solid #333;

}

.prompt{

    color:#00ff66;
    margin-right:10px;

}

#command{

    flex:1;
    background:#111;
    color:#00ff66;
    border:none;
    outline:none;
    font-size:15px;

}

.status{

    padding:8px 20px;
    background:#181818;
    border-top:1px solid #333;
    color:#aaa;
    font-size:13px;

}

</style>

</head>

<body>

<div class="header">

    <h2>Remote Terminal</h2>

    <button onclick="clearTerminal()">Clear</button>

</div>

<div id="terminal"></div>

<div class="input-area">

    <span class="prompt" id="prompt">
        C:\>
    </span>

    <input
        id="command"
        autocomplete="off"
        autofocus
        placeholder="Enter command..."
    >

</div>

<div class="status">

    Status :
    <span id="status">Ready</span>

</div>

<script>

const terminal=document.getElementById("terminal");
const input=document.getElementById("command");
const prompt=document.getElementById("prompt");
const status=document.getElementById("status");

let history=[];
let historyIndex=-1;

function append(text){

    terminal.innerHTML+=text+"<br>";

    terminal.scrollTop=terminal.scrollHeight;

}

append("Remote Terminal Connected");
append("");

input.addEventListener("keydown",async function(e){

    if(e.key==="Enter"){

        const cmd=input.value.trim();

        if(cmd==="")
            return;

        history.push(cmd);
        historyIndex=history.length;

        append(prompt.innerText+" "+cmd);

        status.innerText="Running...";

        input.value="";

        try{

            const res=await fetch("/execute",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    command:cmd

                })

            });

            const data=await res.json();

            if(data.cwd){

                prompt.innerText=data.cwd+">";

            }

            if(data.output){

                append(data.output);

            }

            status.innerText="Ready";

        }

        catch(err){

            append("Error : "+err);

            status.innerText="Disconnected";

        }

    }

    if(e.key==="ArrowUp"){

        if(history.length){

            historyIndex=Math.max(0,historyIndex-1);

            input.value=history[historyIndex];

        }

        e.preventDefault();

    }

    if(e.key==="ArrowDown"){

        if(history.length){

            historyIndex=Math.min(history.length,historyIndex+1);

            input.value=history[historyIndex]||"";

        }

        e.preventDefault();

    }

});

function clearTerminal(){

    terminal.innerHTML="";

}

</script>

</body>
</html>
