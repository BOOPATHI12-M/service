<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Camera (WebRTC) · Laptop Control</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
body { background:#0c0c0c; color:#e6e6e6; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.header {
    width:100%; height:56px; background:#1a1a1a; border-bottom:1px solid #333;
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;
}
.header h2 { font-size:17px; color:#00ff99; }
.header .meta { font-size:12px; color:#888; }
.stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; width:100%; }
video {
    max-width:min(1100px, 95vw); width:auto; border:2px solid #333; border-radius:10px;
    background:#000; aspect-ratio:16/9; object-fit:contain;
}
.controls { display:flex; align-items:center; gap:12px; }
button {
    padding:10px 22px; font-size:15px; border-radius:6px; cursor:pointer;
    border:1px solid #555; background:#222; color:#fff;
}
button:hover { background:#333; }
button.primary { background:#00a86b; border-color:#00a86b; }
button.primary:hover { background:#00c07d; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#666; margin-right:6px; vertical-align:middle; }
.dot.live { background:#ff4d4d; box-shadow:0 0 8px #ff4d4d; }
#status { font-size:13px; color:#aaa; }
</style>
</head>
<body>
<div class="header">
    <h2><span id="dot" class="dot"></span>Live Camera <span style="font-size:12px;color:#888">· WebRTC</span></h2>
    <span class="meta">Authorized monitoring · real-time peer-to-peer video</span>
</div>

<div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="controls">
        <label style="font-size:14px;color:#ccc;display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="audioChk"> Enable audio (mic + speaker)
        </label>
        <button id="toggle" class="primary">Start</button>
        <span id="status">Idle</span>
    </div>
</div>

<script>
const video    = document.getElementById("video");
const toggle   = document.getElementById("toggle");
const statusEl = document.getElementById("status");
const dot      = document.getElementById("dot");
const agentId  = new URLSearchParams(location.search).get("agent");   // which laptop

let pc = null;
let localStream = null;                        // admin mic (to talk to employee)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const setStatus = (t) => (statusEl.textContent = t);

// Wait for ICE candidate gathering to finish (non-trickle) so all candidates
// are baked into the SDP we send through the command queue.
function waitIce(pc) {
    return new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") return resolve();
        const check = () => {
            if (pc.iceGatheringState === "complete") {
                pc.removeEventListener("icegatheringstatechange", check);
                resolve();
            }
        };
        pc.addEventListener("icegatheringstatechange", check);
        setTimeout(resolve, 4000);   // fallback so we never hang
    });
}

async function start() {
    if (!agentId) { setStatus("No laptop selected."); return; }
    toggle.textContent = "Stop";
    dot.classList.add("live");
    setStatus("Creating connection…");

    const wantAudio = document.getElementById("audioChk").checked;

    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pc.addTransceiver("video", { direction: "recvonly" });   // always receive video
    pc.ontrack = (e) => { video.srcObject = e.streams[0]; setStatus("● Live"); };
    pc.onconnectionstatechange = () => {
        if (!pc) return;
        setStatus("Connection: " + pc.connectionState);
        if (["failed", "disconnected", "closed"].includes(pc.connectionState)) dot.classList.remove("live");
    };

    // audio: get the admin's mic (to talk) and un-mute so we can hear the employee.
    // The employee still has to click "Allow" on their own machine.
    if (wantAudio) {
        video.muted = false;
        try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch { localStream = null; }            // no admin mic -> listen-only
        if (localStream) localStream.getAudioTracks().forEach((t) => pc.addTrack(t, localStream));
        else pc.addTransceiver("audio", { direction: "recvonly" });
        setStatus("Requesting permission on the laptop…");
    }

    // 1) make an offer
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce(pc);

    // 2) send the offer to the agent as tool 10
    if (!wantAudio) setStatus("Sending offer to laptop…");
    const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            tool_no: 10,
            agent_id: agentId,
            payload: { sdp: pc.localDescription.sdp, type: pc.localDescription.type, audio: wantAudio },
        }),
    });
    if (!res.ok) { setStatus("Failed to send offer."); return stop(); }
    const { command_id } = await res.json();

    // 3) poll for the agent's answer
    setStatus("Waiting for answer…");
    let answer = null;
    for (let i = 0; i < 60; i++) {
        if (!pc) return;                       // stopped meanwhile
        const r = await (await fetch(`/api/result/${command_id}`)).json();
        if (r.ready) { answer = r; break; }
        await sleep(500);
    }
    if (!answer) { setStatus("No answer — is the agent running?"); return stop(); }
    if (answer.content_type !== "json") { setStatus(answer.data); return stop(); }

    // 4) apply the answer — media now flows peer-to-peer
    let ans;
    try { ans = JSON.parse(answer.data); } catch { setStatus("Bad answer."); return stop(); }
    if (!ans.sdp) { setStatus("Bad answer."); return stop(); }
    await pc.setRemoteDescription(ans);
    setStatus("Negotiated — connecting media…");
}

function stop() {
    if (pc) { try { pc.close(); } catch {} pc = null; }
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    video.srcObject = null;
    toggle.textContent = "Start";
    dot.classList.remove("live");
    setStatus("Stopped");
}

toggle.addEventListener("click", () => { if (pc) stop(); else start(); });
window.addEventListener("beforeunload", stop);
</script>
</body>
</html>
