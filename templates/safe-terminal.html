<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Terminal · Laptop Control</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Consolas, "Courier New", monospace; }
body { background:#0c0c0c; color:#e6e6e6; height:100vh; display:flex; flex-direction:column; }
.header {
    height:52px; background:#1a1a1a; border-bottom:1px solid #333;
    display:flex; align-items:center; justify-content:space-between; padding:0 18px;
}
.header h2 { font-size:16px; color:#00ff99; }
.header .hint { font-size:12px; color:#888; }
#terminal { flex:1; overflow-y:auto; padding:16px 18px; white-space:pre-wrap; word-break:break-word; line-height:1.45; }
#terminal .cmd { color:#7fd7ff; }
#terminal .err { color:#ff6b6b; }
#terminal .out { color:#c8f7c8; }
.input-area { display:flex; align-items:center; padding:12px 18px; background:#111; border-top:1px solid #333; }
.prompt { color:#00ff99; margin-right:10px; white-space:nowrap; }
#command { flex:1; background:transparent; color:#00ff99; border:none; outline:none; font-size:15px; }
.status { padding:6px 18px; background:#181818; border-top:1px solid #2a2a2a; color:#888; font-size:12px; }
</style>
</head>
<body>
<div class="header">
    <h2>Safe Terminal</h2>
    <span class="hint">whitelisted commands only · dir · ipconfig · tasklist · whoami …</span>
</div>

<div id="terminal"></div>

<div class="input-area">
    <span class="prompt" id="prompt">C:\&gt;</span>
    <input id="command" autocomplete="off" autofocus placeholder="Type a command and press Enter…">
</div>

<div class="status">Status: <span id="status">Ready</span></div>

<script>
const term    = document.getElementById("terminal");
const input   = document.getElementById("command");
const promptEl = document.getElementById("prompt");
const statusEl = document.getElementById("status");

let history = [];
let histIdx = -1;

function line(text, cls) {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = text;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const agentId = new URLSearchParams(location.search).get("agent");  // which laptop

// Post a tool-9 command, then poll for its result (same API the dashboard uses).
async function runCommand(cmd) {
    statusEl.textContent = "Running…";
    const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tool_no: 9, payload: { command: cmd }, agent_id: agentId }),
    });
    if (!res.ok) { line("Failed to queue command.", "err"); statusEl.textContent = "Error"; return; }
    const { command_id } = await res.json();

    for (let i = 0; i < 60; i++) {
        const r = await (await fetch(`/api/result/${command_id}`)).json();
        if (r.ready) {
            renderOutput(r.data);
            statusEl.textContent = "Ready";
            return;
        }
        await sleep(1000);
    }
    line("Timed out — is the agent running on the laptop?", "err");
    statusEl.textContent = "Timed out";
}

function renderOutput(data) {
    const text = (data || "").replace(/\s+$/, "");
    if (!text) return;
    // If the agent replied with just a prompt like "C:\path>", update the prompt.
    if (/^[A-Za-z]:\\.*>$/.test(text.trim())) {
        promptEl.textContent = text.trim();
        return;
    }
    const cls = /not allowed|not found|Error|timed out/i.test(text) ? "err" : "out";
    line(text, cls);
}

input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
        const cmd = input.value.trim();
        if (!cmd) return;
        history.push(cmd); histIdx = history.length;
        line(promptEl.textContent + " " + cmd, "cmd");
        input.value = "";
        if (cmd.toLowerCase() === "cls") { term.innerHTML = ""; return; }
        await runCommand(cmd);
    } else if (e.key === "ArrowUp") {
        if (history.length) { histIdx = Math.max(0, histIdx - 1); input.value = history[histIdx]; }
        e.preventDefault();
    } else if (e.key === "ArrowDown") {
        if (history.length) { histIdx = Math.min(history.length, histIdx + 1); input.value = history[histIdx] || ""; }
        e.preventDefault();
    }
});

line("Safe Terminal ready. Only whitelisted commands run on the laptop.", "out");
</script>
</body>
</html>
