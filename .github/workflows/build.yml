name: Build Windows Release EXE

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller agent.spec

      - name: Verify executable was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/agent.exe")) {
            throw "dist/agent.exe was not created by PyInstaller."
          }

      - name: Upload executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/agent.exe