name: Build Windows Release EXE

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Verify required files
        shell: pwsh
        run: |
          if (-not (Test-Path "agent.spec")) {
            throw "agent.spec not found."
          }

          if (-not (Test-Path "agent.ico")) {
            throw "agent.ico not found."
          }

          if (-not (Test-Path "agent.py")) {
            throw "agent.py not found."
          }

          Write-Host "Required files found."

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --clean agent.spec

      - name: Verify executable was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/service.exe")) {
            Write-Host "Contents of dist/:"

            if (Test-Path dist) {
              Get-ChildItem -Recurse dist |
                Format-Table -AutoSize |
                Out-String |
                Write-Host
            }
            else {
              Write-Host "dist/ was never created."
            }

            throw "dist/service.exe was not created by PyInstaller."
          }

          $size = (Get-Item "dist/service.exe").Length / 1MB

          Write-Host ""
          Write-Host "========================================"
          Write-Host " Build successful!"
          Write-Host " File: dist/service.exe"
          Write-Host (" Size: {0:N1} MB" -f $size)
          Write-Host "========================================"

      - name: Upload executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/service.exe