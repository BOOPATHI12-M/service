# Render Blueprint — deploys this folder as one Node web service.
# Render auto-detects this file when you create a "Blueprint" from the repo.
#
# runtime/buildCommand/startCommand are all set explicitly. That matters
# because this repo also holds the Windows Python agent (agent.py,
# requirements.txt); without them Render's auto-detection sees the Python
# files first and tries to build a Python app, which fails with
# "No start command detected". The agent is never run on the server — it is
# built into agent.exe by .github/workflows/build.yml.
services:
  - type: web
    name: laptop-control
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    plan: free                 # spins down when idle; see DEPLOY.md
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production      # turns on the AGENT_KEY fail-fast in server.js
      - key: AGENT_KEY
        generateValue: true    # Render generates a random secret; copy it into agent.py
      - key: ONLINE_MS
        value: "15000"
